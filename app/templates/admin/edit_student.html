{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">GESTÃO</p><h1>Editar aluno</h1><p class="muted">Atualize os dados de {{ student.full_name }}.</p></div><a class="button" href="{{ url_for('admin.students') }}">Voltar aos alunos</a></div><form class="panel form-grid student-edit-form" method="post" enctype="multipart/form-data"><label>Nome completo<input name="full_name" value="{{ student.full_name }}" required></label><label>Código do aluno<input name="code" value="{{ student.code }}" required></label><label>Nome de utilizador<input name="username" value="{{ student.user.username }}" required></label><label>Nova palavra-passe <small>(deixe vazio para manter)</small><input type="password" name="password" minlength="8"></label><label>E-mail<input type="email" name="email" value="{{ student.email or '' }}"></label><label>Telefone<input name="phone" value="{{ student.phone or '' }}"></label><label>Género<input name="gender" value="{{ student.gender or '' }}"></label><label>Nova foto de perfil<input type="file" name="profile_photo" accept=".jpg,.jpeg,.png,.webp">{% if student.profile_photo %}<small>Já existe uma foto. Envie outra para substituir.</small>{% endif %}</label><div class="form-actions"><button class="button primary">Guardar alterações</button><a class="button" href="{{ url_for('admin.students') }}">Cancelar</a></div></form>{% endblock %}
