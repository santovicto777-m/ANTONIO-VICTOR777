{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">ESTRUTURA DO CURSO</p><h1>Módulos</h1></div></div><div class="split"><form class="panel form-grid" method="post"><h2>Novo módulo</h2><label>Nome do módulo<input name="name" required></label><button class="button primary">Adicionar módulo</button></form><section class="panel"><div class="table-wrap"><table><thead><tr><th>Módulo</th><th>Pesos configuráveis</th><th></th></tr></thead><tbody>{% for module in modules %}<tr><td><strong>{{ module.name }}</strong></td><td><form class="weight-form" method="post" action="{{ url_for('admin.update_weights', module_id=module.id) }}">{% for assessment in module.assessments %}<label>{{ assessment.name }}<input type="number" name="weight_{{ assessment.id }}" min="0" max="100" step="1" value="{{ assessment.weight }}"></label>{% endfor %}<button class="button">Guardar pesos</button></form></td><td><form method="post" action="{{ url_for('admin.delete_module', module_id=module.id) }}" onsubmit="return confirm('Eliminar este módulo e as suas notas?')"><button class="link-button danger">Eliminar</button></form></td></tr>{% endfor %}</tbody></table></div></section></div>{% endblock %}
